# Manifiesto del estándar DevSecOps (esquema: 02-pipelines/config/devsecops.schema.json;
# convenciones: 00-gobernanza/00-convenciones.md; generado por bootstrap-repo.sh v2.0)
version: 1
proyecto: novuchat
modo: A            # A | B | B0 (ver 00-gobernanza/03-ambientes-modos-y-aprobaciones.md)
cobertura_minima: 70
componentes:
  # Unico componente desplegable: el sitio administrativo en Firebase.
  # El directorio admin/ lo construye otro agente; mientras no tenga
  # package.json, los jobs de Node de ci-node-firebase.yml se omiten y la
  # compuerta se sostiene sobre calidad-documentacion + seguridad-estatica.
  # Los flujos de n8n (Flujos/*.json) NO se despliegan desde el CI: se
  # importan a mano en la instancia y se publican desde su interfaz.
  - nombre: admin
    ruta: ./admin
    stack: node
    proveedor: firebase
    ambientes:
      staging:
        proyecto: novuchat-admin-staging
        url: https://novuchat-admin-staging.web.app
      production:
        proyecto: novuchat-admin-prod
        url: https://novuchat-admin-prod.web.app
seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]   # se puede endurecer (añadir MEDIUM), nunca relajar
  # id, herramienta, componente, justificacion, aprobado_por, creado, vence
  #
  # ✅ EXCEPCIÓN APLICADA. Aprobada por Andres el 2026-08-30.
  # El análisis que la sustenta queda abajo, junto a la excepción.
  #
  # Análisis (2026-08-30, sobre el árbol de dependencias real):
  #   Trivy bloquea por CVE-2026-41907 en `uuid` 9.0.1, que entra como
  #   dependencia transitiva de firebase-admin/firebase-functions vía gaxios,
  #   google-gax y teeny-request. El CVE afecta a `v3`, `v5` y `v6` cuando se
  #   les pasa un búfer de salida externo. Se revisó todo node_modules: la
  #   ÚNICA llamada a uuid en el árbol es `uuid.v4()` en teeny-request; no hay
  #   una sola llamada a v3, v5 ni v6. La vulnerabilidad no es alcanzable.
  #   La alternativa es forzar `overrides: { uuid: ^11.1.1 }` en
  #   admin/package.json, que sube una versión mayor de una dependencia
  #   transitiva del runtime de Functions y no se puede probar sin un proyecto
  #   Firebase. Ver .github/DESPLIEGUE-FIREBASE.md §7.
  #
  # NO se declara `componente`: el job seguridad-estatica analiza con ruta '.'
  # y el componente del manifiesto es './admin', así que una excepción con
  # componente quedaría filtrada y no surtiría efecto.
  excepciones:
    - id: CVE-2026-41907
      herramienta: trivy
      justificacion: >-
        uuid 9.0.1 llega solo como transitiva de firebase-admin. El CVE afecta
        a v3/v5/v6 con buffer externo; en todo el arbol la unica llamada es
        uuid.v4() en teeny-request, verificado sobre node_modules. No es
        alcanzable. Se revisa cuando firebase-admin actualice gaxios.
      aprobado_por: Andres Alberdi
      creado: 2026-08-30
      vence: 2026-10-31

  # ---------------------------------------------------------------------------
  # ⏸️ RESPALDO PREPARADO, NO APLICADO — hallazgo de Gitleaks del PR #1.
  #
  # La salida elegida fue de configuración: dos allowlists por FORMA DEL VALOR
  # en .github/gitleaks.toml (asignación con valor vacío, y literal
  # true/false/número). Es preferible a esta excepción porque no fija una
  # huella de commit: describe por qué el dato no es un secreto.
  #
  # PERO no se pudo ejecutar gitleaks localmente para confirmarlo: instalarlo
  # exige descargar un binario y no hay autorización para descargas. Si el
  # próximo run sigue en rojo por `Secretos (Gitleaks)`, descomentar estas seis
  # líneas es la salida garantizada: la huella es exacta (commit + archivo +
  # regla + línea) y no puede tapar ningún otro hallazgo.
  #
  # Falso positivo verificado y reproducido: la regla generic-api-key cruza el
  # salto de línea cuando el valor está vacío y captura el renglón siguiente.
  # Lo que reporta como secreto es la cadena VITE_USAR_EMULADORES=true.
  # ---------------------------------------------------------------------------
    - id: ce0b484c46b784957ace1313296bf7089630dcd0:admin/scripts/emuladores.sh:generic-api-key:111
      herramienta: gitleaks
      justificacion: >-
        Falso positivo: VITE_APPCHECK_SITE_KEY esta vacio y generic-api-key
        cruza el salto de linea, capturando VITE_USAR_EMULADORES=true como si
        fuera el secreto. No hay ninguna credencial en ese archivo.
      aprobado_por: Andres Alberdi
      creado: 2026-08-30
      vence: 2026-10-31
