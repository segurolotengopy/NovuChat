# Manifiesto del estándar DevSecOps (esquema: 02-pipelines/config/devsecops.schema.json;
# convenciones: 00-gobernanza/00-convenciones.md; generado por bootstrap-repo.sh v2.0)
version: 1
proyecto: novuchat
modo: A            # A | B | B0 (ver 00-gobernanza/03-ambientes-modos-y-aprobaciones.md)
cobertura_minima: 70
componentes:
  # Unico componente desplegable: el sitio administrativo en Firebase.
  # El directorio admin/ lo construye otro agente; mientras no tenga
  # package.json, los jobs de Node de ci-node-firebase.yml se omiten y la
  # compuerta se sostiene sobre calidad-documentacion + seguridad-estatica.
  # Los flujos de n8n (Flujos/*.json) NO se despliegan desde el CI: se
  # importan a mano en la instancia y se publican desde su interfaz.
  - nombre: admin
    ruta: ./admin
    stack: node
    proveedor: firebase
    # Estado real (2026-09-12): la consola en producción vive en el proyecto
    # que CONFIGURACION.local.md registra —no en «novuchat-admin-prod», que no
    # aparece en la cuenta dueña de producción—. Los ID van como marcador: el
    # repositorio es público (CONVENCIONES-REPO-PUBLICO.md). El pipeline no lee
    # este bloque; toma los proyectos de vars.GCP_PROJECT_ID_STAGING y
    # vars.GCP_PROJECT_ID_PROD.
    # Staging (2026-09-25): proyecto Firebase propio, separado del de
    # producción, diseñado en docs/staging/DISENO.md. Mientras la variable de
    # GitHub esté vacía, desplegar-staging y dast-y-humo se omiten.
    ambientes:
      staging:
        proyecto: ${GCP_PROJECT_ID_STAGING}
        url: https://${GCP_PROJECT_ID_STAGING}.web.app
      production:
        proyecto: ${GCP_PROJECT_ID}
        url: https://consola.novuchat.site
seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]   # se puede endurecer (añadir MEDIUM), nunca relajar
  # id, herramienta, componente, justificacion, aprobado_por, creado, vence
  #
  # ✅ CERRADA el 2026-09-25: la excepción por CVE-2026-41907 (`uuid` 9.0.1,
  # transitiva de gaxios 6 y teeny-request vía firebase-admin 13 y
  # firebase-tools 15) ya no hace falta. El lockfile del workspace fuerza
  # `uuid ^11.1.1` con un override en admin/pnpm-workspace.yaml (pnpm 11 ya no
  # lee `pnpm.overrides` de package.json), y `uuid@9.0.1` desapareció de
  # admin/pnpm-lock.yaml, que es lo que Trivy escanea. El análisis original
  # (2026-08-30) sigue valiendo para el runtime de Cloud Functions, que instala
  # desde admin/functions/package.json sin ese override: la única llamada del
  # árbol es uuid.v4() en teeny-request, y el CVE afecta a v3/v5/v6 con búfer
  # externo. Ver .github/DESPLIEGUE-FIREBASE.md §7.
  #
  # NO se declara `componente` en ninguna excepción: el job seguridad-estatica
  # analiza con ruta '.' y el componente del manifiesto es './admin', así que
  # una excepción con componente quedaría filtrada y no surtiría efecto.
  excepciones:


  # ---------------------------------------------------------------------------
  # ✅ CERRADA el 2026-10-01: la excepción de Gitleaks por el falso positivo del
  # PR #1 (generic-api-key cruzaba el salto de línea de
  # `VITE_APPCHECK_SITE_KEY=` vacío y capturaba `VITE_USAR_EMULADORES=true`;
  # huella ce0b484c46b7:admin/scripts/emuladores.sh:generic-api-key:111). Seguía
  # activa porque la acción de CI instalaba gitleaks 8.24.3, que ignoraba las
  # allowlists; el reusable 2.8 fija GITLEAKS_VERSION 8.30.1 y la allowlist por
  # forma del valor de .github/gitleaks.toml la cubre. Medido: gitleaks 8.30.1
  # sobre el árbol y los 874 commits, con ese toml, sin hallazgos.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # RIESGO ACEPTADO (04/10/2026), no es excepcion de escaner: ninguna herramienta
  # del pipeline lo detecta, y el esquema no admite herramienta «manual» ni un
  # archivo como componente. Lo hace cumplir construir.mjs --verificar.
  #   id:           EXC-QTACO-EJEC-ERROR
  #   herramienta:  manual (revision de seguridad M-1, PR #382 y PR #395)
  #   componente:   Flujos/experimental/venta-minima/venta-minima.qtaco.json
  #   severidad:    MEDIUM
  #   justificacion: Andres decidio el 04/10/2026 que el flujo de Q'Taco guarde
  #     TODAS las ejecuciones (saveDataSuccessExecution=all, saveDataErrorExecution=all,
  #     saveExecutionProgress=false), por lo menos 24 horas, para diagnosticar el
  #     piloto. La base de n8n guardara por ejecucion: el encabezado Authorization
  #     del webhook «Carrito del catalogo» (credencial NovuChat ingesta (Q'Taco), la
  #     misma de la ingesta, la configuracion, el cotejo y el cierre), telefonos,
  #     nombres, textos, direcciones y pedidos de clientes, enlaces del catalogo con
  #     ficha de 128 bits, la URL del QR de cobro, notas de voz y comprobantes de
  #     pago (imagen o PDF), y la copia del flujo con sus rutas de webhook.
  #     Mitigaciones: acceso solo del propietario a n8n y su API; poda actual de la
  #     instancia (unos 14 dias, 10.000 maximo) ACEPTADA por Andres el 04/10 para el
  #     piloto (global y compartida con Bellido: no se baja); modo de datos binarios
  #     en filesystem con permisos 700, verificado en la VM en solo lectura (ver
  #     DISENO.md de venta-minima); rotacion del secreto de
  #     ingesta (scripts/rotar-ingesta.sh) al vencer y ante cualquier exportacion o
  #     captura; el resto de los JSON (prueba, ensayo en el Demo A, otros tenants)
  #     siguen en none.
  #   aprobado_por: Andres Alberdi (04/10/2026, en el chat de Cartera)
  #   creado:       2026-10-04
  #   vence:        2026-12-31
  #   Al vencer: o se baja a none, o se renueva con nueva justificacion; no se
  #   prorroga en silencio.
  # ---------------------------------------------------------------------------
  # ACTIVA (01/10/2026): CKV_GHA_7 de Checkov sobre release.yml y
  # ci-node-firebase.yml. Desde el reusable de seguridad 2.7, el job
  # `workflows` analiza los workflows (antes Checkov los descartaba sin avisar).
  # Comprobado con entradas_workflow_dispatch.py del estándar: 13 ok, 0 fallos.
  # Apartarse del texto del estándar: NovuChat tiene un tercer input, `destino`,
  # y `tag` y `confirmar` no son obligatorios (se dice abajo). Se revisa al vencer.
  # ---------------------------------------------------------------------------
    - id: CKV_GHA_7
      herramienta: checkov
      justificacion: >-
        Regla SLSA sobre workflow_dispatch con inputs, en dos workflows
        (revisado el 2026-10-01 con entradas_workflow_dispatch.py del estandar:
        13 ok, 0 fallos; ningun input se interpola en un script). (1)
        release.yml declara `tipo`, un choice de [auto, patch, minor, major], y
        `prerelease`, un boolean: GitHub rechaza cualquier otro valor antes de
        que arranque, y `tipo` llega al shell por variable de entorno
        (TIPO_ENTRADA). (2) ci-node-firebase.yml declara `destino`, un choice
        de [dev, produccion] que solo se usa en condiciones `if:`, y `tag` y
        `confirmar`, de texto y opcionales: `confirmar` solo se compara con la
        cadena DESPLEGAR en el `if:` de desplegar-produccion; `tag` llega a
        actions/checkout (`ref:`) y a una variable de entorno (TAG) que el
        shell usa entre comillas, y antes de desplegar a produccion se exige
        que sea un tag existente (refs/tags/), sin guion y ancestro de main,
        y que quien lo lanza este en APROBADORES_PROD; vacio, falla. Con
        destino=dev y un tag cargado, calidad y seguridad analizan ese tag pero
        construir-staging y desplegar-dev construyen y despliegan github.ref: el
        tag no cambia lo que se despliega, pero si lo que se verifico (pendiente,
        se corrige en otro PR). Solo
        quien tiene permiso de escritura lanza un workflow_dispatch. Quitar los
        inputs obligaria a editar el workflow en cada release o despliegue
        manual.
      aprobado_por: Andres Alberdi
      creado: "2026-10-01"
      vence: "2026-12-30"
