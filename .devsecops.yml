  # 0 hallazgos (braces no aparece en ninguna severidad); osv-scanner 2.5.1
  # sobre admin/pnpm-lock.yaml, 0 hallazgos con CVSS >= 7 y braces ausente.
  # Si el aviso se reabre, la excepcion se vuelve a pedir con justificacion
