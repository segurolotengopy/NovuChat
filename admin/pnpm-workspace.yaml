packages:
  - web
  - functions

# Scripts de postinstalación permitidos. Todo lo demás queda bloqueado: un
# paquete transitivo no debe poder ejecutar código al instalar sin que alguien
# lo haya decidido. `esbuild` y `protobufjs` lo necesitan para funcionar
# (binario nativo y generación de código); el resto se deja en false.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': false
  re2: false

# Endurecimiento de cadena de suministro (lo pide Semgrep, y con razon).
#
# `minimumReleaseAge` esta DESACTIVADO a proposito, no por olvido. Se probo con
# 7 dias y el pipeline fallo: `59 lockfile entries failed` -- la cuarentena no
# se puede aplicar retroactivamente a un lockfile que ya contiene paquetes
# recien publicados, porque pnpm verifica TODAS las entradas, no solo las
# nuevas. Es una politica para resoluciones futuras: se adopta regenerando el
# lockfile cuando esos paquetes hayan envejecido, no antes.
#
# minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
