packages:
  - web
  - functions

# Scripts de postinstalación permitidos. Todo lo demás queda bloqueado: un
# paquete transitivo no debe poder ejecutar código al instalar sin que alguien
# lo haya decidido. `esbuild` y `protobufjs` lo necesitan para funcionar
# (binario nativo y generación de código); el resto se deja en false.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': false
  re2: false

# Endurecimiento de cadena de suministro (lo pide Semgrep, y con razon).
# Una version publicada hace minutos es la ventana en que aparecen los paquetes
# comprometidos: la cuarentena de 7 dias la cierra sin costo real.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
