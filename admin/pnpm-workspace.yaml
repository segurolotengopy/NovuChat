# Version forzada de `qs`. Trivy bloquea el pipeline por dos avisos de
# denegacion de servicio en 6.15.3 --CVE-2026-82417 y CVE-2026-82562-- que
# GitHub clasifica como media y baja pero Trivy trata como bloqueantes. Llega
# como transitiva por varios caminos (express, body-parser, gcp-metadata) y el
# salto a 6.16.0 es de PARCHE, asi que se arregla en vez de pedir una excepcion:
# una dependencia parchada es mejor que una excepcion documentada.
overrides:
  qs: ^6.16.0

packages:
  - web
  - functions

# Scripts de postinstalación permitidos. Todo lo demás queda bloqueado: un
# paquete transitivo no debe poder ejecutar código al instalar sin que alguien
# lo haya decidido. `esbuild` y `protobufjs` lo necesitan para funcionar
# (binario nativo y generación de código); el resto se deja en false.
allowBuilds:
  esbuild: true
  protobufjs: true
  '@firebase/util': false
  re2: false

# Endurecimiento de cadena de suministro: PENDIENTE, y no por descuido.
#
# Semgrep pide tres politicas de pnpm. Las tres son legitimas y las tres estan
# desactivadas, porque NINGUNA se puede adoptar sobre un lockfile que ya existe:
# pnpm verifica las 969 entradas contra la politica, no solo las que se
# resuelven de nuevo. Comprobado contra el pipeline, no supuesto:
#
#   minimumReleaseAge: 10080   -> 59 entradas rechazadas (ERR_PNPM_LOCKFILE_
#                                 RESOLUTION_VERIFICATION): paquetes publicados
#                                 hace menos de 7 dias.
#   trustPolicy: no-downgrade  ->  3 entradas rechazadas (ERR_PNPM_TRUST_
#                                 DOWNGRADE).
#   blockExoticSubdeps: true   -> sin comprobar; se desactiva junto con las
#                                 otras para no seguir descubriendo fallos de a
#                                 uno, a tres minutos por corrida del pipeline.
#
# Adoptarlas exige REGENERAR el lockfile con las politicas ya activas, y eso es
# una tarea deliberada -- cambia versiones resueltas y hay que probar el panel
# despues -- no algo que se cuele en un PR que tiene que quedar verde hoy.
# Queda para despues del congelamiento del 8 de septiembre.
#
# minimumReleaseAge: 10080
# trustPolicy: no-downgrade
# blockExoticSubdeps: true
