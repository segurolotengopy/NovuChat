# =============================================================================
# dependabot.yml — NovuChat
# -----------------------------------------------------------------------------
# Adaptado del estándar al stack REAL del repositorio. Se retiraron los
# ecosistemas `pip`, `docker` y `terraform` que traía la plantilla: no hay
# requirements.txt ni pyproject.toml (el único Python es un generador suelto
# sin dependencias), no hay Dockerfile y no hay /infra. Un `directory` que no
# existe no es inofensivo: Dependabot lo reporta como error de configuración
# del repositorio y ensucia la pestaña de alertas.
#
# `cooldown` es obligatorio en todos los ecosistemas. Sin él, Dependabot puede
# proponer una versión publicada hace minutos, que es la ventana en la que
# aparecen los paquetes comprometidos por robo de credenciales del publicador.
# Siete días de espera es el valor que exige la regla
# package_managers.dependabot.dependabot-missing-cooldown de Semgrep, que
# bloqueaba el pipeline.
# =============================================================================
version: 2
updates:
  # --- Acciones de GitHub (fijadas por SHA; Dependabot las actualiza) --------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencias, github-actions, seguridad]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # --- Panel administrativo (workspace pnpm en admin/) ----------------------
  # El lockfile vive en admin/pnpm-lock.yaml y cubre admin/web y
  # admin/functions. No hay package.json en la raíz del repositorio.
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    cooldown:
      # Una versión mayor merece más cuarentena que un parche: es donde más
      # ruido y más regresiones hay.
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    labels: [dependencias, npm]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    versioning-strategy: increase
    groups:
      npm-produccion-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      npm-desarrollo:
        dependency-type: development
        update-types: [minor, patch]
