# =============================================================================
# ci-node-firebase.yml — Pipeline completo SPA Node/React (Vite/Vitest)
#                        → Firebase Hosting + reglas de Firestore
# Versión: 2.0 | Fecha: 2026-08-24
# -----------------------------------------------------------------------------
# Flujo (ver 00-gobernanza/02-flujo-git-y-versionado.md):
#   PR → main ............ preparar, calidad, seguridad-estatica, construir
#   push main ............ + desplegar-staging → dast-y-humo
#   push tag v* .......... + desplegar-produccion (Environment production)
#                            → post-despliegue (health check + rollback)
#   workflow_dispatch .... Modo B0: producción manual con confirmar=DESPLEGAR
#
# Identidad: Workload Identity Federation (sin JSON de service account).
# FirebaseExtended/action-hosting-deploy NO se usa porque solo acepta JSON de
# SA; en su lugar google-github-actions/auth (impersonación) + firebase-tools
# fijado, que soporta ADC (external_account) desde 15.x.
#
# Secretos: GCP_WIF_PROVIDER, GCP_SA_DEPLOY_STAGING, GCP_SA_DEPLOY_PROD
#           (+ GITLEAKS_LICENSE / SNYK_TOKEN opcionales, heredados)
# Variables: MODO, APROBADORES_PROD, TAG_FIRMADO_REQUERIDO, GCP_PROJECT_ID_STAGING,
#            GCP_PROJECT_ID_PROD, STAGING_URL, PROD_URL, HEALTH_PATH,
#            NODE_VERSION (22), COVERAGE_MIN (70), GHAS_ENABLED, BLOQUEAR_EN,
#            FIREBASE_DEPLOY_ONLY ('hosting,firestore:rules,firestore:indexes,functions,storage'),
#            FIREBASE_SITE_ID, FIREBASE_PREVIEW ('true' para canales de PR)
#
# ALCANCE DE LAS VARIABLES (2026-09-25). Las del repositorio son las de
# PRODUCCIÓN (VITE_*, SITIO_PUBLICO, FIREBASE_DEPLOY_ONLY, ...). El Environment
# `staging` tiene las suyas CON EL MISMO NOMBRE, y GitHub le da precedencia
# cuando un job lo declara: construir-staging, desplegar-staging y
# humo-staging. Una variable que falte en el Environment cae en silencio al
# valor de producción, y por eso esos jobs verifican cada una contra
# GCP_PROJECT_ID_STAGING antes de usarla. Las de producción NO se mueven al
# Environment `production`: su revisor obligatorio detendría `construir` en
# cada PR (ver docs/staging/DISENO.md §3).
# =============================================================================
name: CI/CD Node → Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      destino:
        description: A dónde desplegar
        type: choice
        required: true
        default: dev
        options: [dev, produccion]
      tag:
        # Solo para destino=produccion. El job de producción NO confía en este
        # campo: verifica que el tag exista, no sea prerelease, sea ancestro de
        # origin/main y que quien ejecuta esté en vars.APROBADORES_PROD.
        description: 'Solo produccion — Tag vX.Y.Z ya creado (ancestro de main)'
        type: string
        required: false
      confirmar:
        description: 'Solo produccion — escriba DESPLEGAR para publicar'
        type: string
        required: false

# Mínimo global; cada job eleva lo que necesita.
permissions:
  contents: read

# Un solo run activo por rama/tag. En producción NO se cancela un despliegue
# en curso (concurrency propia en el job).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # El unico componente desplegable de NovuChat es el sitio administrativo de
  # Firebase, que vive en admin/. Mientras ese directorio no tenga package.json
  # los jobs de Node se omiten y la compuerta se sostiene sobre
  # calidad-documentacion + seguridad-estatica. Ver .devsecops.yml.
  RUTA_COMPONENTE: admin
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  # firebase-tools fijado: verificar en npm antes de subir de versión (hubo una
  # regresión de ADC en 15.22.2, jun-2026).
  FIREBASE_TOOLS_VERSION: '15.28.1'

jobs:
  # ---------------------------------------------------------------------------
  # Fase 0 — preparar: detecta el gestor de paquetes y calienta la caché.
  # ---------------------------------------------------------------------------
  preparar:
    name: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pm: ${{ steps.pm.outputs.pm }}
      instalar: ${{ steps.pm.outputs.instalar }}
      # true si este evento toca el componente (o es un tag / dispatch)
      admin_cambio: ${{ steps.cambios.outputs.admin_cambio }}
      # nombre del script de pruebas de reglas de Firestore, vacio si no hay
      script_reglas: ${{ steps.pm.outputs.script_reglas }}
      # true si existe RUTA_COMPONENTE/package.json (el sitio admin/ ya aterrizo)
      hay_componente: ${{ steps.pm.outputs.hay_componente }}
      lockfile: ${{ steps.pm.outputs.lockfile }}
      # true si package.json define el script test:rules (pruebas de Firestore)
      hay_test_rules: ${{ steps.pm.outputs.hay_test_rules }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag || github.ref }}
          # Historia completa: el paso "Detectar cambios" necesita comparar
          # contra la base del PR o contra el commit anterior del push.
          fetch-depth: 0

      - name: Detectar componente Node y gestor de paquetes
        id: pm
        env:
          RUTA: ${{ env.RUTA_COMPONENTE }}
        run: |
          set -euo pipefail
          if [[ ! -f "${RUTA}/package.json" ]]; then
            echo "No existe ${RUTA}/package.json: el componente Node todavia no"
            echo "esta en el repositorio. Se omiten los jobs de Node."
            {
              echo "hay_componente=false"; echo "pm=npm"
              echo "instalar=true"; echo "lockfile="; echo "hay_test_rules=false"
              echo "script_reglas="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if   [[ -f "${RUTA}/pnpm-lock.yaml" ]]; then
            pm=pnpm; instalar="pnpm install --frozen-lockfile"; lockfile="${RUTA}/pnpm-lock.yaml"
          elif [[ -f "${RUTA}/yarn.lock" ]]; then
            pm=yarn; instalar="yarn install --immutable";       lockfile="${RUTA}/yarn.lock"
          else
            pm=npm;  instalar="npm ci";                          lockfile="${RUTA}/package-lock.json"
          fi
          hay_test_rules=$(jq -r 'if .scripts["test:rules"] then "true" else "false" end' "${RUTA}/package.json")
          # Nombre real del script de pruebas de reglas de Firestore. El
          # estandar asume `test:rules`; este proyecto lo llama `pruebas:reglas`.
          script_reglas=$(jq -r '
            if .scripts["pruebas:reglas"] then "pruebas:reglas"
            elif .scripts["test:rules"] then "test:rules"
            else "" end' "${RUTA}/package.json")
          {
            echo "hay_componente=true"; echo "pm=$pm"; echo "instalar=$instalar"
            echo "lockfile=$lockfile"; echo "hay_test_rules=$hay_test_rules"
            echo "script_reglas=$script_reglas"
          } >> "$GITHUB_OUTPUT"
          echo "Componente: $RUTA | Gestor: $pm | test:rules: $hay_test_rules"

      # -------------------------------------------------------------------
      # Filtro de rutas hecho DENTRO del workflow, no en el trigger `on:`.
      # El motivo es concreto: `compuerta-pr` es el unico status check que
      # exige el ruleset de main. Si se filtrara con `on: pull_request: paths:`,
      # un PR que solo toca documentacion no dispararia el workflow, el check
      # requerido quedaria eternamente pendiente y el PR no se podria fusionar
      # nunca. Filtrando aca, el workflow siempre corre y siempre reporta;
      # lo que se omite es la parte cara (construir y desplegar el panel).
      # El estandar lo admite: 02-pipelines/README.md linea 233 recomienda
      # filtrar por rutas en monorepos.
      # -------------------------------------------------------------------
      - name: Detectar cambios en el componente
        id: cambios
        env:
          RUTA: ${{ env.RUTA_COMPONENTE }}
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          ANTES_PUSH: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Un tag o un workflow_dispatch son ordenes explicitas de publicar:
          # no se filtran nunca, aunque el diff no toque el componente.
          if [[ "$EVENTO" == "workflow_dispatch" ]] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Evento de publicacion explicita: no se filtra por rutas."
            echo "admin_cambio=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          case "$EVENTO" in
            pull_request) base="$BASE_PR" ;;
            push)         base="$ANTES_PUSH" ;;
            *)            base="" ;;
          esac

          # Sin base utilizable (primer push de la rama, base de todo ceros,
          # commit ausente tras un force-push) se asume que SI cambio: ante la
          # duda, el pipeline completo, nunca el atajo.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Sin base de comparacion fiable: se asume cambio en el componente."
            echo "admin_cambio=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # La CABEZA tambien puede faltar, y ese caso no estaba cubierto. En un
          # pull_request, GITHUB_SHA es el commit de FUSION (refs/pull/N/merge),
          # que no siempre esta en el clon: si la rama recibe un push mientras
          # la corrida arranca, ese commit se reemplaza y el que quedo anotado
          # deja de existir. `git diff` contra un objeto ausente aborta con
          # codigo 128, y con `set -e` se lleva puesto el job entero --que fue
          # exactamente lo que paso, y con un mensaje que no dice nada:
          # "fatal: bad object <sha>".
          cabeza="$GITHUB_SHA"
          if ! git cat-file -e "${cabeza}^{commit}" 2>/dev/null; then
            echo "La cabeza ${cabeza} no esta en el clon: se usa HEAD."
            cabeza="$(git rev-parse HEAD)"
          fi

          archivos=$(git diff --name-only "$base" "$cabeza")
          echo "Archivos cambiados:"; echo "$archivos" | sed 's/^/  /'
          # Cambiar el propio pipeline tambien obliga a ejercitarlo entero.
          if echo "$archivos" | grep -qE "^(${RUTA}/|\.github/workflows/)"; then
            echo "admin_cambio=true" >> "$GITHUB_OUTPUT"
            echo "El componente ${RUTA}/ (o el pipeline) cambio: se construye."
          else
            echo "admin_cambio=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin cambios en ${RUTA}/: se omiten construir y desplegar."
          fi

      - name: Habilitar corepack (pnpm/yarn)
        if: steps.pm.outputs.hay_componente == 'true' && steps.pm.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js con cache
        if: steps.pm.outputs.hay_componente == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.pm.outputs.pm }}
          cache-dependency-path: ${{ steps.pm.outputs.lockfile }}

      - name: Instalar dependencias (calienta la cache para los demas jobs)
        if: steps.pm.outputs.hay_componente == 'true'
        working-directory: ${{ env.RUTA_COMPONENTE }}
        run: ${{ steps.pm.outputs.instalar }}

  # ---------------------------------------------------------------------------
  # Fase 1 — calidad: lint + pruebas con cobertura mínima + reglas Firestore.
  # ---------------------------------------------------------------------------
  calidad:
    name: calidad
    needs: preparar
    # Se omite si el componente no existe todavia, o si este evento no lo toca.
    # compuerta-pr distingue esos 'skipped' legitimos de un fallo real.
    if: >-
      needs.preparar.outputs.hay_componente == 'true'
      && needs.preparar.outputs.admin_cambio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ needs.preparar.outputs.hay_componente == 'true' && 'admin' || '.' }}
    env:
      COVERAGE_MIN: ${{ vars.COVERAGE_MIN || 70 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag || github.ref }}

      # ---------------------------------------------------------------------
      # CONTROL 1 — Prohibiciones de renderizado.
      # Portado de despliegue-admin.yml (retirado: duplicaba el despliegue).
      #
      # El visor de conversaciones muestra texto escrito por clientes finales
      # de WhatsApp. Ese texto es entrada NO CONFIABLE: es dato, jamas marcado
      # ni instruccion (§1 y §3 de ~/.claude/rules/security-rules.md). Este
      # paso impide que alguien reintroduzca una via por la que ese texto se
      # interprete como HTML o como codigo.
      #
      # Se descartan las lineas de comentario a proposito: TextoSeguro.tsx
      # explica la prohibicion y nombra `dangerouslySetInnerHTML` dos veces,
      # en comentarios. Explicar la prohibicion no es violarla.
      # Va ANTES de instalar dependencias: es barato y falla rapido.
      # ---------------------------------------------------------------------
      - name: Prohibiciones de renderizado
        run: |
          set -euo pipefail
          patrones='dangerouslySetInnerHTML|\.innerHTML|document\.write|new Function\(|eval\('
          hallazgos=$(grep -rInE "$patrones" web/src functions/src \
                      | grep -vE ':[0-9]+: *(\*|//|/\*)' || true)
          if [ -n "$hallazgos" ]; then
            echo "$hallazgos"
            echo "::error::Se encontro una via de interpretacion de texto no confiable."
            exit 1
          fi
          echo "Sin coincidencias fuera de comentarios."

      # ---------------------------------------------------------------------
      # CONTROL 2 — Las reglas de Firestore niegan por defecto.
      # Portado de despliegue-admin.yml. Que nadie deshaga el aislamiento
      # entre comercios borrando la negacion final del archivo de reglas.
      # ---------------------------------------------------------------------
      - name: Las reglas niegan por defecto
        run: |
          set -euo pipefail
          grep -q 'match /{documento=\*\*} {' firestore.rules
          grep -q 'allow read, write: if false;' firestore.rules
          echo "La negacion final esta presente."
          # Mismo control para Storage: un camino nuevo tiene que nacer cerrado.
          if [[ -f storage.rules ]]; then
            grep -q 'match /{todo=\*\*} {' storage.rules
            grep -q 'allow read, write: if false;' storage.rules
            echo "La negacion final de storage.rules esta presente."
          fi

      - name: Habilitar corepack
        if: needs.preparar.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.preparar.outputs.pm }}
          cache-dependency-path: ${{ needs.preparar.outputs.lockfile }}

      - name: Instalar dependencias
        run: ${{ needs.preparar.outputs.instalar }}

      - name: Lint
        # En un workspace pnpm el script `lint` vive en los paquetes (web/),
        # no en la raiz: `pnpm -r` lo alcanza, `npm run` desde la raiz no.
        env:
          PM: ${{ needs.preparar.outputs.pm }}
        run: |
          set -euo pipefail
          if [[ "$PM" == "pnpm" ]]; then pnpm -r --if-present run lint
          else npm run lint --if-present; fi

      - name: Verificacion de tipos (si existe el script)
        env:
          PM: ${{ needs.preparar.outputs.pm }}
        run: |
          set -euo pipefail
          if [[ "$PM" == "pnpm" ]]; then pnpm -r --if-present run typecheck
          else npm run typecheck --if-present; fi

      # ---------------------------------------------------------------------
      # Pruebas unitarias con cobertura. El panel todavia no define un script
      # `test` con cobertura (sus pruebas hoy son las de reglas de Firestore,
      # que corren mas abajo contra el emulador). El control NO se elimina: se
      # anuncia como no aplicado, para que se vea que falta, y vuelve a
      # exigirse solo con agregar el script `test` en admin/package.json.
      # ---------------------------------------------------------------------
      - name: ¿Hay pruebas unitarias con cobertura?
        id: cobertura
        run: |
          set -euo pipefail
          if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin script 'test' en package.json: el umbral COVERAGE_MIN=${COVERAGE_MIN} % NO se esta aplicando. Agregue pruebas unitarias con cobertura."
            echo "### ⚠️ Cobertura no verificada: falta el script \`test\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pruebas unitarias con cobertura (Vitest)
        if: steps.cobertura.outputs.hay == 'true'
        # json-summary es lo que lee el umbral; text es para el log.
        run: >-
          npm test --
          --run --coverage
          --coverage.reporter=text --coverage.reporter=json-summary

      - name: Umbral de cobertura (COVERAGE_MIN=${{ env.COVERAGE_MIN }} %)
        if: steps.cobertura.outputs.hay == 'true'
        run: |
          set -euo pipefail
          archivo=coverage/coverage-summary.json
          if [[ ! -f "$archivo" ]]; then
            echo "::error::No existe $archivo. Habilite coverage en vitest.config (provider v8/istanbul)."
            exit 1
          fi
          lineas=$(jq -r '.total.lines.pct' "$archivo")
          echo "Cobertura de líneas: $lineas % (mínimo $COVERAGE_MIN %)"
          echo "### Cobertura: $lineas % (mínimo $COVERAGE_MIN %)" >> "$GITHUB_STEP_SUMMARY"
          if (( $(echo "$lineas < $COVERAGE_MIN" | bc -l) )); then
            echo "::error::Cobertura $lineas % por debajo del mínimo $COVERAGE_MIN %"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # CONTROL 3 — Pruebas de las reglas de Firestore contra el emulador.
      # Portado de despliegue-admin.yml. Son las pruebas que verifican el
      # aislamiento entre comercios; sin ellas, un cambio en firestore.rules
      # entra sin red.
      #
      # Se invoca el script DEL PROYECTO (admin/pruebas/correr.sh), no
      # `firebase emulators:exec`. Motivo, documentado en ese script: el
      # detector de arranque del CLI reporta "port taken" aunque el puerto
      # este libre y deja el proceso Java huerfano. El script levanta el jar
      # directamente y es determinista. Si algun dia conviene volver al camino
      # estandar, admin/package.json ya tiene `pruebas:reglas:cli`.
      #
      # Java: ubuntu-latest lo trae, pero se fija la version para no depender
      # de que la imagen del runner cambie.
      # ---------------------------------------------------------------------
      - name: Java para el emulador de Firestore
        if: needs.preparar.outputs.script_reglas != ''
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar el emulador de Firestore
        if: needs.preparar.outputs.script_reglas != ''
        # Deja el jar en ~/.cache/firebase/emulators/, que es donde lo busca
        # pruebas/correr.sh. No inicia sesion: el emulador es 100 % local.
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} setup:emulators:firestore

      - name: Pruebas de reglas de Firestore (emulador)
        if: needs.preparar.outputs.script_reglas != ''
        env:
          PM: ${{ needs.preparar.outputs.pm }}
          SCRIPT: ${{ needs.preparar.outputs.script_reglas }}
        run: |
          set -euo pipefail
          "$PM" run "$SCRIPT"

      # ---------------------------------------------------------------------
      # CONTROL 3b — Pruebas de las reglas de Storage (storage.rules).
      #
      # A diferencia de Firestore, el emulador de Storage solo arranca con el
      # CLI (firebase emulators:exec), y tiene que correr JUNTO al de Firestore:
      # las reglas leen la ficha del comercio con firestore.get() y el emulador
      # la resuelve contra el Firestore del mismo proceso. Lo hace
      # admin/pruebas/correr-storage.sh con una configuración y puertos
      # propios. Usa el firebase-tools del lockfile (ya instalado arriba) y el
      # Java del paso "Java para el emulador de Firestore": el motor de reglas
      # de Storage también es un jar, que el CLI descarga si falta.
      #
      # Si existe storage.rules y no hay script de pruebas, FALLA: unas reglas
      # de acceso sin pruebas son exactamente lo que este job existe para
      # impedir.
      # ---------------------------------------------------------------------
      - name: Pruebas de reglas de Storage (emuladores Firestore + Storage)
        if: needs.preparar.outputs.script_reglas != ''
        # TIEMPO LÍMITE PROPIO. Si el emulador se cuelga al arrancar (ya pasó
        # en local, el 15/09), sin esto el paso se come el tiempo del job
        # entero antes de fallar. En local la suite tarda ~10 s con los
        # emuladores ya descargados; el primer arranque en un runner baja el
        # jar del motor de reglas. El script además corta `emulators:exec`
        # con `timeout` (TIMEOUT_EMULADORES, 300 s por defecto).
        timeout-minutes: 8
        env:
          PM: ${{ needs.preparar.outputs.pm }}
        run: |
          set -euo pipefail
          if [[ ! -f storage.rules ]]; then
            echo "Sin storage.rules: nada que probar."; exit 0
          fi
          if ! jq -e '.scripts["pruebas:reglas:storage"]' package.json >/dev/null; then
            echo "::error::Existe storage.rules pero falta el script pruebas:reglas:storage en package.json."
            exit 1
          fi
          "$PM" run pruebas:reglas:storage

  # ---------------------------------------------------------------------------
  # Fase 2 — seguridad-estatica: reusable OSS (todos los modos).
  # NOTA: en el repositorio del proyecto la ruta es local
  # (./.github/workflows/_reusable-security.yml); bootstrap-repo.sh copia el
  # archivo. Los secretos se pasan UNO POR UNO, no con `secrets: inherit`:
  # inherit entrega al workflow llamado TODOS los secretos del repositorio,
  # incluidas las credenciales de despliegue, que un escáner no necesita. Lo
  # marca Semgrep (yaml.github-actions.security.secrets-inherit) y es la §5 de
  # ~/.claude/rules/security-rules.md: privilegio mínimo. Estos dos son los
  # únicos que `_reusable-security.yml` declara, y ambos son opcionales.
  # subir_sarif: solo cuando Code Scanning está disponible (público o GHAS).
  # ---------------------------------------------------------------------------
  seguridad-estatica:
    name: seguridad-estatica
    needs: preparar
    permissions:
      contents: read
      # security-events: write solo lo usa el reusable cuando subir_sarif = true
      # (Code Scanning en Modo A/B). No se concede pull-requests: write: los
      # escáneres no comentan en el PR.
      security-events: write
      actions: read
    uses: ./.github/workflows/_reusable-security.yml
    with:
      ruta: '.'
      stack: node
      bloquear_en: ${{ vars.BLOQUEAR_EN || 'CRITICAL,HIGH' }}
      subir_sarif: ${{ github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true' }}
      ref: ${{ inputs.tag || '' }}
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ---------------------------------------------------------------------------
  # Fase 1.b — calidad-documentacion: el stack que HOY existe en el repositorio
  # (Markdown, JSON de flujos n8n, Bash, Python) mas la verificacion de saneo
  # del repositorio publico. Corre siempre, exista o no el componente Node, y
  # es lo que impide que compuerta-pr quede vacia mientras admin/ no aterrice.
  # ---------------------------------------------------------------------------
  calidad-documentacion:
    name: calidad-documentacion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Sintaxis de los scripts Bash
        run: |
          set -euo pipefail
          mapfile -t archivos < <(git ls-files '*.sh')
          if [[ ${#archivos[@]} -eq 0 ]]; then echo "Sin scripts .sh"; exit 0; fi
          printf '%s\n' "${archivos[@]}"
          for f in "${archivos[@]}"; do bash -n "$f"; done
          echo "Sintaxis correcta en ${#archivos[@]} script(s)."

      - name: ShellCheck
        run: |
          set -euo pipefail
          mapfile -t archivos < <(git ls-files '*.sh')
          [[ ${#archivos[@]} -eq 0 ]] && exit 0
          shellcheck --severity=warning --external-sources "${archivos[@]}"

      - name: Sintaxis de los scripts Python
        run: |
          set -euo pipefail
          mapfile -t archivos < <(git ls-files '*.py')
          [[ ${#archivos[@]} -eq 0 ]] && exit 0
          python3 -m py_compile "${archivos[@]}"
          echo "Sintaxis correcta en ${#archivos[@]} archivo(s) Python."

      - name: JSON valido (flujos de n8n y configuracion)
        run: |
          set -euo pipefail
          fallos=0
          while IFS= read -r f; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::JSON invalido"; fallos=$((fallos+1))
            fi
          done < <(git ls-files '*.json')
          [[ $fallos -eq 0 ]] || exit 1
          echo "Todos los JSON versionados son validos."

      - name: Manifiesto .devsecops.yml conforme al esquema
        run: |
          set -euo pipefail
          python3 -c "import yaml; yaml.safe_load(open('.devsecops.yml'))"
          echo "Manifiesto YAML valido."

      - name: Saneo del repositorio publico (modo patrones)
        # En CI no existen CONFIGURACION.local.md ni .env: el script corre solo
        # su modo de patrones genericos. El contraste contra los valores reales
        # es el gancho pre-commit de la maquina del operador.
        run: ./scripts/verificar-saneo.sh --patrones

  # ---------------------------------------------------------------------------
  # Fase 3 — construir: build de PRODUCCIÓN (Vite). APP_ENV selecciona el
  # archivo .env.<ambiente> que Vite carga con --mode. El artifact dist/ se
  # despliega tal cual en producción (se despliega lo que se probó).
  #
  # DOS JOBS, NO UNA MATRIZ (2026-09-25). Antes una matriz construía staging y
  # producción con las MISMAS variables VITE_* del repositorio, así que un
  # staging habría hablado con el Auth y el Firestore de producción
  # (Analisis/28 §1). Ahora las VITE_* de staging viven en el Environment
  # `staging`, y para leerlas el job tiene que declararlo. No se puede declarar
  # por rama de matriz, y declarar `environment: production` acá detendría
  # cada PR ante el revisor obligatorio. Por eso: `construir` (producción, con
  # las variables del repositorio, corre en PR, push y tag) y
  # `construir-staging` (Environment `staging`, solo en push a main).
  # ---------------------------------------------------------------------------
  construir:
    name: construir
    needs: preparar
    if: >-
      needs.preparar.outputs.hay_componente == 'true'
      && needs.preparar.outputs.admin_cambio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ needs.preparar.outputs.hay_componente == 'true' && 'admin' || '.' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag || github.ref }}

      - name: Habilitar corepack
        if: needs.preparar.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.preparar.outputs.pm }}
          cache-dependency-path: ${{ needs.preparar.outputs.lockfile }}

      - name: Instalar dependencias
        run: ${{ needs.preparar.outputs.instalar }}

      - name: Build (production)
        env:
          APP_ENV: production
          PM: ${{ needs.preparar.outputs.pm }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.sha }}
          # Configuracion PUBLICA del cliente Firebase: viaja en el bundle, no
          # son secretos. Van como variables del repositorio para no versionar
          # los identificadores del proyecto (repositorio publico). Las del
          # repositorio son las de PRODUCCION; las de staging las lee
          # construir-staging desde su Environment.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          # El bucket del archivo de planes de Captación (lib/firebase.ts). Sin
          # esta línea la variable del repositorio no llega al bundle: la
          # consola compila igual, pero con Storage apagado y «Subir»
          # deshabilitado. Ver docs/seguridad/reglas-storage.md §Despliegue.
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
        run: |
          set -euo pipefail
          # Workspace: los scripts de construccion viven en la raiz del
          # componente y delegan en los paquetes. Si no existen, se cae al
          # `build` plano que asume el estandar.
          if jq -e '.scripts["web:build"]' package.json >/dev/null 2>&1; then
            "$PM" run web:build -- --mode "$APP_ENV"
            if jq -e '.scripts["functions:build"]' package.json >/dev/null 2>&1; then
              "$PM" run functions:build
            fi
          else
            npm run build -- --mode "$APP_ENV"
          fi

      # ---------------------------------------------------------------------
      # Cloud Functions: el punto donde este despliegue tiene mas chance de
      # romperse, y por que.
      #
      # `firebase deploy` NO sube el monorepo: comprime solo el directorio
      # `source` de firebase.json (aca `functions/`), excluyendo node_modules
      # y .git. Verificado leyendo firebase-tools 14.27:
      # lib/deploy/functions/prepareFunctionsUpload.js linea 56.
      #
      # Consecuencias, las tres:
      #
      #  1. `functions/lib/` esta en .gitignore, asi que NO viene del checkout.
      #     Si no se construye aca, se sube un paquete cuyo `main` apunta a un
      #     archivo inexistente. Por eso se construye y se guarda como
      #     artefacto, y los jobs de despliegue lo bajan.
      #
      #  2. `pnpm-lock.yaml` vive en admin/, NO en admin/functions/, asi que no
      #     entra al zip. Cloud Build (buildpack de Google) instala con npm, sin
      #     lockfile: resuelve el ultimo semver compatible y el despliegue deja
      #     de ser reproducible. Se genera un package-lock.json DENTRO de
      #     functions/ para que si entre al zip y Cloud Build use `npm ci`.
      #
      #  3. Si alguna dependencia de functions/package.json usara el protocolo
      #     `workspace:*`, npm fallaria con EUNSUPPORTEDPROTOCOL en Cloud Build,
      #     lejos de aca y con un mensaje poco claro. Hoy no hay ninguna
      #     (verificado); este paso lo mantiene asi.
      # ---------------------------------------------------------------------
      - name: Cloud Functions — sin dependencias `workspace:`
        run: |
          set -euo pipefail
          if [[ ! -f functions/package.json ]]; then
            echo "Sin functions/: nada que verificar."; exit 0
          fi
          malas=$(jq -r '
            ((.dependencies // {}) + (.devDependencies // {}))
            | to_entries[] | select(.value | tostring | startswith("workspace:"))
            | "\(.key)=\(.value)"' functions/package.json)
          if [[ -n "$malas" ]]; then
            echo "$malas"
            echo "::error::functions/package.json usa el protocolo 'workspace:'. Cloud Build instala con npm y fallara con EUNSUPPORTEDPROTOCOL. Publique el paquete o copie el codigo dentro de functions/."
            exit 1
          fi
          echo "Sin dependencias 'workspace:'."

      - name: Cloud Functions — lockfile npm para Cloud Build
        run: |
          set -euo pipefail
          [[ -f functions/package.json ]] || exit 0
          # El lockfile queda dentro de functions/, que es lo unico que firebase
          # sube, y hace que Cloud Build use `npm ci` en vez de `npm install`
          # sin lock. Se genera en una carpeta APARTE y se verifica: correrlo
          # aca, sobre el node_modules de pnpm, escribia las dependencias como
          # enlaces y `npm ci` instalaba 3 paquetes sin firebase-functions
          # (v0.1.2, 2026-09-12). El porque completo esta en el script.
          bash scripts/lockfile-functions.sh

      - name: Localizar el directorio construido
        id: dist
        run: |
          set -euo pipefail
          # firebase.json de este proyecto publica `web/dist`; el esqueleto del
          # estandar asume `dist`. Se acepta cualquiera de los dos.
          for d in web/dist dist; do
            if [[ -d "$d" ]]; then
              echo "ruta=$d" >> "$GITHUB_OUTPUT"
              echo "Construido en ${RUTA_COMPONENTE:-.}/$d"
              exit 0
            fi
          done
          echo "::error::No se encontro el directorio construido (web/dist ni dist)."
          exit 1

      - name: Guardar dist/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-production
          path: ${{ env.RUTA_COMPONENTE }}/${{ steps.dist.outputs.ruta }}/
          retention-days: 7
          if-no-files-found: error

      # Se despliega lo que se probo: el `lib/` compilado y el lockfile viajan
      # como artefacto, no se reconstruyen en el job de despliegue.
      # El `predeploy` de admin/firebase.json respeta esto: con CI=true y el
      # `lib/index.js` presente NO recompila. Antes recompilaba siempre, y en el
      # job de despliegue —que no instala dependencias— `tsc` fallaba con
      # «Cannot find module 'firebase-functions/...'» (v0.1.0, 2026-09-12).
      # En la maquina de quien despliega a mano sigue recompilando siempre.
      - name: Guardar functions/ (lib compilado + package-lock)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functions-production
          path: |
            ${{ env.RUTA_COMPONENTE }}/functions/lib/
            ${{ env.RUTA_COMPONENTE }}/functions/package-lock.json
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Fase 3.b — construir-staging: el MISMO build, con las variables del
  # Environment `staging`. Ver el bloque de `construir` para el porqué de dos
  # jobs. Solo en push a main (y en el dispatch a dev): el Environment limita
  # las ramas a `main`, y un job de PR que lo declare falla antes de arrancar.
  # Se omite si no hay proyecto de staging, igual que desplegar-staging.
  # ---------------------------------------------------------------------------
  construir-staging:
    name: construir-staging
    needs: preparar
    if: >-
      needs.preparar.outputs.hay_componente == 'true'
      && needs.preparar.outputs.admin_cambio == 'true'
      && vars.GCP_PROJECT_ID_STAGING != ''
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.destino == 'dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    defaults:
      run:
        working-directory: ${{ env.RUTA_COMPONENTE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      # LA COMPUERTA DE ESTE JOB. Las VITE_* se leen con el mismo nombre que
      # las de producción y las resuelve el Environment; si alguna falta en el
      # Environment, GitHub entrega la del repositorio —la de producción— sin
      # avisar, y el paquete de staging hablaría con producción. Se verifica
      # cada una contra el proyecto de staging ANTES de compilar.
      - name: Las VITE_* son las del proyecto de staging
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          NUMERO: ${{ vars.GCP_PROJECT_NUMBER_STAGING }}
          PROYECTO_PROD: ${{ vars.GCP_PROJECT_ID_PROD }}
          VITE_PROYECTO: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          # Los identificadores no se imprimen en el registro (repositorio público).
          for v in "$PROYECTO" "$NUMERO" "$PROYECTO_PROD" "$VITE_API_KEY" "$VITE_APP_ID"; do
            [[ -n "$v" ]] && echo "::add-mask::$v"
          done
          fallos=0
          if [[ -z "$PROYECTO" || "$PROYECTO" == "$PROYECTO_PROD" ]]; then
            echo "::error::GCP_PROJECT_ID_STAGING está vacía o es el proyecto de producción."; fallos=1
          fi
          if [[ "$VITE_PROYECTO" != "$PROYECTO" ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID no es el proyecto de staging: falta en el Environment 'staging' (cae al valor del repositorio, que es producción)."; fallos=1
          fi
          if [[ "$VITE_AUTH_DOMAIN" != "$PROYECTO".* ]]; then
            echo "::error::VITE_FIREBASE_AUTH_DOMAIN no pertenece al proyecto de staging."; fallos=1
          fi
          if [[ -n "$VITE_BUCKET" && "${VITE_BUCKET#gs://}" != "$PROYECTO".* ]]; then
            echo "::error::VITE_FIREBASE_STORAGE_BUCKET no es un bucket del proyecto de staging."; fallos=1
          fi
          # El appId lleva el NÚMERO del proyecto (1:<número>:web:<hash>): con el
          # número de staging en el Environment se sabe a qué proyecto pertenece
          # sin conocer el valor de producción. La apiKey no dice de quién es;
          # acá solo se exige que exista, y desplegar-staging la compara, ya
          # autenticado, con la app registrada en el proyecto de staging.
          if [[ -z "$NUMERO" || ! "$NUMERO" =~ ^[0-9]+$ ]]; then
            echo "::error::GCP_PROJECT_NUMBER_STAGING falta en el Environment 'staging' (la carga preparar-staging.sh app)."; fallos=1
          elif [[ ! "$VITE_APP_ID" =~ ^1:${NUMERO}:web:[0-9a-f]+$ ]]; then
            echo "::error::VITE_FIREBASE_APP_ID no es una app web del proyecto de staging: falta en el Environment (cae a la de producción) o tiene otra forma."; fallos=1
          fi
          if [[ -z "$VITE_API_KEY" ]]; then
            echo "::error::VITE_FIREBASE_API_KEY vacía."; fallos=1
          fi
          # La clave de App Check está atada a un dominio: la de producción no
          # sirve en staging. En el Environment se declara vacía a propósito.
          exit "$fallos"

      - name: Habilitar corepack
        if: needs.preparar.outputs.pm != 'npm'
        run: corepack enable

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ needs.preparar.outputs.pm }}
          cache-dependency-path: ${{ needs.preparar.outputs.lockfile }}

      - name: Instalar dependencias
        run: ${{ needs.preparar.outputs.instalar }}

      - name: Build (staging)
        env:
          APP_ENV: staging
          PM: ${{ needs.preparar.outputs.pm }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          # App Check VACÍO en staging, fijado acá y no por variable: la clave
          # de producción está atada a su dominio, GitHub no admite una variable
          # de Environment vacía, y sin variable en `staging` se usaría la del
          # repositorio (la de producción). Con la clave vacía la consola no
          # inicializa App Check (`web/src/lib/firebase.ts`).
          VITE_APPCHECK_SITE_KEY: ''
        run: |
          set -euo pipefail
          if jq -e '.scripts["web:build"]' package.json >/dev/null 2>&1; then
            "$PM" run web:build -- --mode "$APP_ENV"
            if jq -e '.scripts["functions:build"]' package.json >/dev/null 2>&1; then
              "$PM" run functions:build
            fi
          else
            npm run build -- --mode "$APP_ENV"
          fi

      # Los tres pasos siguientes son los mismos de `construir`; el porqué de
      # cada uno está comentado allá.
      - name: Cloud Functions — sin dependencias `workspace:`
        run: |
          set -euo pipefail
          if [[ ! -f functions/package.json ]]; then
            echo "Sin functions/: nada que verificar."; exit 0
          fi
          malas=$(jq -r '
            ((.dependencies // {}) + (.devDependencies // {}))
            | to_entries[] | select(.value | tostring | startswith("workspace:"))
            | "\(.key)=\(.value)"' functions/package.json)
          if [[ -n "$malas" ]]; then
            echo "$malas"
            echo "::error::functions/package.json usa el protocolo 'workspace:'."
            exit 1
          fi
          echo "Sin dependencias 'workspace:'."

      - name: Cloud Functions — lockfile npm para Cloud Build
        run: |
          set -euo pipefail
          [[ -f functions/package.json ]] || exit 0
          bash scripts/lockfile-functions.sh

      - name: Localizar el directorio construido
        id: dist
        run: |
          set -euo pipefail
          for d in web/dist dist; do
            if [[ -d "$d" ]]; then
              echo "ruta=$d" >> "$GITHUB_OUTPUT"
              echo "Construido en ${RUTA_COMPONENTE:-.}/$d"
              exit 0
            fi
          done
          echo "::error::No se encontro el directorio construido (web/dist ni dist)."
          exit 1

      - name: Guardar dist/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-staging
          path: ${{ env.RUTA_COMPONENTE }}/${{ steps.dist.outputs.ruta }}/
          retention-days: 7
          if-no-files-found: error

      - name: Guardar functions/ (lib compilado + package-lock)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: functions-staging
          path: |
            ${{ env.RUTA_COMPONENTE }}/functions/lib/
            ${{ env.RUTA_COMPONENTE }}/functions/package-lock.json
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Vista previa en PR (opcional, vars.FIREBASE_PREVIEW == 'true'). Solo para
  # PRs del mismo repositorio (nunca de forks: no reciben secretos ni OIDC).
  # Requiere que el proveedor WIF de staging confíe en `pull_request`.
  # ---------------------------------------------------------------------------
  previsualizar:
    name: previsualizar (canal de PR)
    needs: [calidad, construir]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.FIREBASE_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.RUTA_COMPONENTE }}
    steps:
      - name: Checkout (firebase.json)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag || github.ref }}

      # El paquete de PRODUCCIÓN: construir-staging no corre en PR (el
      # Environment `staging` solo admite `main`). Es lo mismo que pasaba
      # antes del 2026-09-25, cuando ambos paquetes llevaban las variables de
      # producción; y este job sigue apagado (vars.FIREBASE_PREVIEW).
      - name: Descargar dist/
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-production
          # firebase.json de admin/ publica `web/dist`.
          path: ${{ env.RUTA_COMPONENTE }}/web/dist

      - name: Descargar functions/ (lib compilado + package-lock)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: functions-production
          # Restaura lib/ y package-lock.json donde firebase.json los espera.
          path: ${{ env.RUTA_COMPONENTE }}/functions

      - name: Autenticar en GCP (WIF + impersonación)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_STAGING }}

      - name: Desplegar canal de vista previa (expira en 7 días)
        id: canal
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          CANAL: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          firebase hosting:channel:deploy "$CANAL" --project "$PROYECTO" \
            --expires 7d --non-interactive --json | tee canal.json
          url=$(jq -r '.result | to_entries[0].value.url' canal.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar URL en el PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          URL_CANAL: ${{ steps.canal.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Vista previa desplegada: ${process.env.URL_CANAL} (expira en 7 días)`
            });

  # ---------------------------------------------------------------------------
  # Fase 4 — desplegar-staging: automático en cada push a main.
  #
  # Se OMITE (no falla) mientras vars.GCP_PROJECT_ID_STAGING esté vacía: así
  # quedó el 2026-09-12 porque no había proyecto de staging, y cada push que
  # tocaba admin/ dejaba main en rojo sin probar nada. Con el proyecto creado
  # y las variables cargadas (docs/staging/DISENO.md), este job, dast-y-humo y
  # humo-staging dejan de omitirse solos.
  #
  # Es el ESPEJO del job de producción —mismos pasos, mismo orden, misma
  # simulación previa— con dos diferencias a propósito:
  #   - no hay aprobación humana: el Environment `staging` no tiene revisores;
  #   - las variables (SITIO_PUBLICO, FIREBASE_DEPLOY_ONLY,
  #     VITE_FIREBASE_STORAGE_BUCKET, FIREBASE_DEPLOY_FORCE) se leen con el
  #     MISMO nombre que en producción y las resuelve el Environment. Como una
  #     que falte caería en silencio al valor de producción, el primer paso
  #     verifica cada una contra el proyecto de staging.
  # ---------------------------------------------------------------------------
  desplegar-staging:
    name: desplegar-staging
    needs: [calidad, seguridad-estatica, construir-staging]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.GCP_PROJECT_ID_STAGING != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Para humo-staging, que corre SIN Environment (necesita las variables del
    # repositorio, es decir las de producción, para comprobar su ausencia).
    outputs:
      bucket: ${{ steps.paquete.outputs.bucket }}
      app_id: ${{ steps.paquete.outputs.app_id }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # token OIDC para WIF
    defaults:
      run:
        working-directory: ${{ env.RUTA_COMPONENTE }}
    steps:
      - name: Checkout (firebase.json, firestore.rules, storage.rules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Descargar dist/
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-staging
          # firebase.json de admin/ publica `web/dist`.
          path: ${{ env.RUTA_COMPONENTE }}/web/dist

      - name: Descargar functions/ (lib compilado + package-lock)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: functions-staging
          path: ${{ env.RUTA_COMPONENTE }}/functions

      - name: Las variables del Environment apuntan al proyecto de staging
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          PROYECTO_PROD: ${{ vars.GCP_PROJECT_ID_PROD }}
          URL_STAGING: ${{ vars.STAGING_URL }}
          URL_PROD: ${{ vars.PROD_URL }}
          SITIO_PUBLICO: ${{ vars.SITIO_PUBLICO }}
          BUCKET_STORAGE: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules,firestore:indexes,functions,storage' }}
        run: |
          set -euo pipefail
          fallos=0
          if [[ -z "$PROYECTO" || "$PROYECTO" == "$PROYECTO_PROD" ]]; then
            echo "::error::GCP_PROJECT_ID_STAGING está vacía o es el proyecto de producción."; fallos=1
          fi
          if [[ -z "$URL_STAGING" || "$URL_STAGING" == "$URL_PROD" ]]; then
            echo "::error::STAGING_URL está vacía o es PROD_URL."; fallos=1
          fi
          if [[ "$SOLO" == *functions* && ( -z "$SITIO_PUBLICO" || "$SITIO_PUBLICO" == "$URL_PROD" ) ]]; then
            echo "::error::SITIO_PUBLICO falta en el Environment 'staging' o es el de producción: los enlaces del catálogo de staging apuntarían a producción."; fallos=1
          fi
          if [[ "$SOLO" == *storage* && "${BUCKET_STORAGE#gs://}" != "$PROYECTO".* ]]; then
            echo "::error::VITE_FIREBASE_STORAGE_BUCKET no es un bucket del proyecto de staging (falta en el Environment)."; fallos=1
          fi
          exit "$fallos"

      - name: Autenticar en GCP (WIF + impersonación de la SA de deploy)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # Ambos secretos viven en el Environment `staging`: el proveedor es
          # el del pool PROPIO del proyecto de staging (docs/staging/DISENO.md
          # §4), no el de producción, y el secreto del Environment tiene
          # precedencia sobre el del repositorio con el mismo nombre.
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_STAGING }}

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: El paquete descargado es el de staging (contra init.json de Hosting)
        # La compuerta de construir-staging mira la FORMA de las variables; acá
        # se compara el paquete con la configuración PÚBLICA del SDK que Firebase
        # Hosting sirve en /__/firebase/init.json (apiKey, appId, projectId…),
        # la misma que devuelve `apps:sdkconfig`, pero por curl y SIN
        # credenciales: así la cuenta de despliegue no necesita
        # roles/firebase.viewer, que trae 290 permisos —leer Firestore, Auth y
        # Storage entre ellos— y que producción no tiene a propósito. Si el
        # paquete se compiló con otras VITE_*, no se despliega.
        #
        # PRIMER DESPLIEGUE: init.json lo sirve el sitio de Hosting, y antes de
        # la primera publicación puede no estar. Entonces se AVISA y se sigue
        # (humo-staging lo exige después, con el sitio ya publicado); nunca se
        # falla en silencio ni se da por verificado.
        id: paquete
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          URL_STAGING: ${{ vars.STAGING_URL }}
          APP_ESPERADA: ${{ vars.VITE_FIREBASE_APP_ID }}
          BUCKET_STORAGE: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          js=$(find web/dist/assets -maxdepth 1 -name 'index-*.js' | head -1)
          [[ -n "$js" ]] || { echo "::error::no hay web/dist/assets/index-*.js en el artefacto"; exit 1; }
          grep -qF "$APP_ESPERADA" "$js" || { echo "::error::el paquete no lleva el appId del Environment 'staging': se compiló con otras VITE_*"; exit 1; }
          cfg=$(curl -sS --max-time 20 -w '\n%{http_code}' "${URL_STAGING%/}/__/firebase/init.json" 2>/dev/null || echo $'\n000')
          codigo="${cfg##*$'\n'}"; cfg="${cfg%$'\n'*}"
          if [[ "$codigo" != "200" ]]; then
            echo "::warning::/__/firebase/init.json respondió $codigo: el sitio de staging todavía no publica su configuración (primer despliegue). humo-staging la exige después."
            { echo "bucket=${BUCKET_STORAGE#gs://}"; echo "app_id=$APP_ESPERADA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api_key=$(jq -r '.apiKey // empty' <<< "$cfg")
          app_id=$(jq -r '.appId // empty' <<< "$cfg")
          proyecto_app=$(jq -r '.projectId // empty' <<< "$cfg")
          [[ -n "$api_key" && -n "$app_id" ]] || { echo "::error::init.json sin apiKey o appId"; exit 1; }
          echo "::add-mask::$api_key"
          [[ "$proyecto_app" == "$PROYECTO" ]] || { echo "::error::init.json no es del proyecto de staging"; exit 1; }
          [[ "$app_id" == "$APP_ESPERADA" ]] || { echo "::error::la app que sirve Hosting no es la del Environment 'staging' (VITE_FIREBASE_APP_ID)"; exit 1; }
          grep -qF "$api_key" "$js" || { echo "::error::el paquete no lleva la apiKey de la app de staging: se compiló con otras VITE_*"; exit 1; }
          echo "El paquete lleva la apiKey y el appId de la app web de staging (según init.json)."
          # Salidas para humo-staging (no son secretos: viajan en el bundle).
          { echo "bucket=${BUCKET_STORAGE#gs://}"; echo "app_id=$app_id"; } >> "$GITHUB_OUTPUT"

      - name: Conservar copia de la versión actual (canal "previa" para rollback)
        # D7: antes de CADA deploy a live (staging y producción) se clona el
        # contenido en vivo a un canal "previa". El rollback es clonar de vuelta:
        # firebase hosting:clone <proyecto>:previa <proyecto>:live
        continue-on-error: true
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          SITIO: ${{ vars.GCP_PROJECT_ID_STAGING }}
        run: |
          firebase hosting:channel:create previa --project "$PROYECTO" --expires 30d \
            --non-interactive >/dev/null 2>&1 || true
          firebase hosting:clone "$SITIO:live" "$SITIO:previa" --project "$PROYECTO"

      - name: Cloud Functions — dependencias para que firebase deploy lea el código
        # Igual que en producción: `firebase deploy` carga lib/index.js para
        # descubrir las Functions y necesita functions/node_modules. Se instala
        # desde el package-lock.json del artefacto, solo runtime, sin scripts.
        env:
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules,firestore:indexes,functions,storage' }}
        run: |
          set -euo pipefail
          if [[ "$SOLO" == *functions* ]]; then
            ( cd functions && npm ci --omit=dev --ignore-scripts --no-audit --no-fund )
            test -f functions/node_modules/firebase-functions/package.json
            echo "Dependencias de runtime de functions/ instaladas desde el lockfile del artefacto."
          fi

      - name: Desplegar hosting + reglas + Functions (staging)
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_STAGING }}
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules,firestore:indexes,functions,storage' }}
          URL_STAGING: ${{ vars.STAGING_URL }}
          SITIO_PUBLICO: ${{ vars.SITIO_PUBLICO }}
          FORZAR_FACTURA: ${{ vars.FIREBASE_DEPLOY_FORCE }}
          BUCKET_STORAGE: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          # Los parámetros de las Functions (`defineString`) se leen de
          # functions/.env, ignorado por git; se escribe desde el Environment.
          # INSTANCIAS_MINIMAS=0: en staging no hay instancia siempre despierta
          # (producción escribe 1; ver `ingesta.ts` y `instancias-minimas.test.ts`).
          # CPU_FRACCIONARIA=si: cada instancia de staging usa 0,1666 vCPU; con
          # los 20 vCPU de cuota del proyecto, una por Function no entraba
          # (`opcionesGlobales.ts`). Producción no la escribe.
          if [[ "$SOLO" == *functions* ]]; then
            printf 'SITIO_PUBLICO=%s\nINSTANCIAS_MINIMAS=0\nCPU_FRACCIONARIA=si\n' "$SITIO_PUBLICO" > functions/.env
          fi
          # El bucket se declara como destino, no se consulta (ver el bloque
          # «EL BUCKET DE STORAGE SE DECLARA» del job de producción).
          if [[ "$SOLO" == *storage* ]]; then
            firebase target:apply storage principal "${BUCKET_STORAGE#gs://}" --project "$PROYECTO"
          fi
          # Simulación primero, con el mismo --force que la publicación; hosting
          # queda fuera porque su prepare crea una versión aun en dry-run. Los
          # porqués, en el job de producción.
          FORZAR=""
          if [[ -n "${FORZAR_FACTURA:-}" ]]; then
            FORZAR="--force"
            echo "::warning::vars.FIREBASE_DEPLOY_FORCE activa en staging: se acepta subir el piso de la factura y --force borra Functions que ya no estén en el código."
          fi
          SIMULAR=$(printf '%s' "$SOLO" | tr ',' '\n' | grep -v -x -e hosting -e '' | paste -sd, - || true)
          if [[ -n "$SIMULAR" ]]; then
            echo "Simulando: $SIMULAR"
            firebase deploy --only "$SIMULAR" --project "$PROYECTO" --non-interactive $FORZAR --dry-run
          fi
          firebase deploy --only "$SOLO" --project "$PROYECTO" --non-interactive $FORZAR \
            --message "staging ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          # Sin la URL: lleva el ID del proyecto y el registro es público. La URL
          # la muestra el Environment del job.
          echo "### Staging desplegado (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # desplegar-dev — camino corto para PROBAR, no para operar.
  #
  # Se dispara SOLO a mano (workflow_dispatch con destino=dev). No corre en
  # push ni en PR, asi que no compite con staging ni con produccion.
  #
  # Por que este camino y no los canales de vista previa de Hosting: un canal
  # de vista previa publica el frontend, pero NO despliega reglas de Firestore,
  # ni indices, ni Functions. El panel sin reglas desplegadas no lee un solo
  # documento: se veria la pantalla de login y nada mas. Ademas exigiria que el
  # proveedor OIDC confiara en el evento `pull_request`, y con el repositorio
  # publico eso amplia la superficie justo donde no conviene.
  #
  # No pide `dast-y-humo` ni bloquea por DAST: es un ambiente de prueba sin
  # datos reales. Si pasa por `calidad`, que es donde viven las prohibiciones
  # de renderizado, la negacion por defecto de las reglas y las 99 pruebas
  # contra el emulador.
  # ---------------------------------------------------------------------------
  desplegar-dev:
    name: desplegar-dev
    # Usa el paquete de STAGING (construir-staging corre también en este
    # dispatch): un ambiente de prueba nunca lleva las variables de producción.
    needs: [preparar, calidad, construir-staging]
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # unica razon: pedir el token OIDC
    defaults:
      run:
        working-directory: ${{ env.RUTA_COMPONENTE }}
    steps:
      - name: Checkout (firebase.json, firestore.rules, functions/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Descargar dist/
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-staging
          path: ${{ env.RUTA_COMPONENTE }}/web/dist

      - name: Descargar functions/ (lib compilado + package-lock)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: functions-staging
          path: ${{ env.RUTA_COMPONENTE }}/functions

      - name: Autenticar en GCP (WIF + impersonacion de la SA de dev)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_DEV }}

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Desplegar en el proyecto de desarrollo
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_DEV }}
          # Functions exige plan Blaze. En un proyecto Spark hay que dejar
          # vars.FIREBASE_DEPLOY_ONLY_DEV en 'hosting,firestore:rules,firestore:indexes'
          # o el despliegue falla entero por ese unico componente.
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY_DEV || 'hosting,firestore:rules,firestore:indexes' }}
        run: |
          set -euo pipefail
          if [[ -z "$PROYECTO" ]]; then
            echo "::error::Falta la variable GCP_PROJECT_ID_DEV."
            exit 1
          fi
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          firebase deploy --only "$SOLO" --project "$PROYECTO" --non-interactive \
            --message "dev ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          echo "### Dev desplegado: componentes [$SOLO] en $PROYECTO" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://${PROYECTO}.web.app" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fase 5 — dast-y-humo: contra staging recién desplegado.
  # ---------------------------------------------------------------------------
  dast-y-humo:
    name: dast-y-humo
    needs: desplegar-staging
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-dast.yml
    with:
      # `vars` en un `with:` de workflow reutilizable se resuelve a nivel de
      # repositorio: STAGING_URL y HEALTH_PATH son variables del repositorio.
      url_objetivo: ${{ vars.STAGING_URL }}
      reglas: .github/zap-rules.tsv
      escaneo_completo: false
      ruta_salud: ${{ vars.HEALTH_PATH || '/healthz' }}

  # ---------------------------------------------------------------------------
  # Fase 5.b — humo-staging: lo que el humo HTTP del reusable no mira
  # (Analisis/28): que las Functions estén detrás de Hosting y contesten como
  # el código dice a un anónimo (401 sin firma, 404 con ficha inválida, 405 con
  # el método equivocado), que las reglas de Firestore y Storage desplegadas
  # nieguen al anónimo, y que el paquete publicado apunte al proyecto de
  # staging y no al de producción. Todo sin credenciales: scripts/humo-staging.sh.
  # ---------------------------------------------------------------------------
  humo-staging:
    name: humo-staging
    needs: desplegar-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SIN Environment, a propósito: así `vars.VITE_FIREBASE_APP_ID` es la del
    # repositorio —la de producción— y el humo puede exigir que NO esté en el
    # paquete publicado. Lo de staging llega por las salidas de
    # desplegar-staging y por las dos variables del repositorio.
    permissions:
      contents: read
    steps:
      - name: Checkout (scripts/humo-staging.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Humo funcional contra staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          GCP_PROJECT_ID_STAGING: ${{ vars.GCP_PROJECT_ID_STAGING }}
          GCP_PROJECT_ID_PROD: ${{ vars.GCP_PROJECT_ID_PROD }}
          APP_ID_PROD: ${{ vars.VITE_FIREBASE_APP_ID }}
          APP_ID_STAGING: ${{ needs.desplegar-staging.outputs.app_id }}
          FIREBASE_STORAGE_BUCKET: ${{ needs.desplegar-staging.outputs.bucket }}
        run: ./scripts/humo-staging.sh

  # ---------------------------------------------------------------------------
  # Fase 6 — desplegar-produccion (D3): push de tag v* estable (nunca
  # prerelease) en Modo A/B, o workflow_dispatch con confirmar=DESPLEGAR
  # (obligatorio en Modo B0, donde no hay Environments con revisores). El step
  # "Verificar aprobación" valida tag, ancestro de main, aprobador y firma.
  # ---------------------------------------------------------------------------
  desplegar-produccion:
    name: desplegar-produccion
    needs: [calidad, seguridad-estatica, construir]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        && !contains(github.ref_name, '-') && vars.MODO != 'B0')
      || (github.event_name == 'workflow_dispatch' && inputs.destino == 'produccion'
            && inputs.confirmar == 'DESPLEGAR')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false # nunca interrumpir un despliegue a producción
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.RUTA_COMPONENTE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token del checkout no queda en .git/config (portado de
          # despliegue-admin.yml, retirado).
          persist-credentials: false
          # En workflow_dispatch se analiza/despliega el tag aprobado (D3)
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # historial y tags completos para verificar la aprobación

      # D3 — Verificación de aprobación previa a producción (todos los modos).
      - name: Verificar aprobación
        env:
          EVENTO: ${{ github.event_name }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ACTOR: ${{ github.actor }}
          APROBADORES: ${{ vars.APROBADORES_PROD }}
          FIRMA_REQUERIDA: ${{ vars.TAG_FIRMADO_REQUERIDO }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if [[ "$EVENTO" == "workflow_dispatch" ]]; then
            # 1) El tag existe
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
              || { echo "::error::El tag '$TAG' no existe en el repositorio"; exit 1; }
            # 2) No es prerelease (v1.2.0-rc.1 nunca despliega producción)
            [[ "$TAG" != *-* ]] \
              || { echo "::error::'$TAG' es un prerelease y no despliega producción"; exit 1; }
            # 3) El tag es ancestro de origin/main (código ya integrado)
            git merge-base --is-ancestor "$TAG" origin/main \
              || { echo "::error::'$TAG' no es ancestro de origin/main"; exit 1; }
            # 4) Quien ejecuta está en vars.APROBADORES_PROD (lista separada por comas)
            lista=",$(echo "$APROBADORES" | tr -d ' '),"
            [[ "$lista" == *",$ACTOR,"* ]] \
              || { echo "::error::'$ACTOR' no está en vars.APROBADORES_PROD"; exit 1; }
            # 5) Firma del tag (obligatoria si vars.TAG_FIRMADO_REQUERIDO == 'true')
            if [[ "$FIRMA_REQUERIDA" == "true" ]]; then
              git tag -v "$TAG" \
                || { echo "::error::El tag '$TAG' no tiene firma verificable (TAG_FIRMADO_REQUERIDO=true)"; exit 1; }
            fi
          else
            # push de tag: ancestro de main y no prerelease
            git merge-base --is-ancestor "$TAG" origin/main \
              || { echo "::error::El tag '$TAG' no es ancestro de origin/main"; exit 1; }
            [[ "$TAG" != *-* ]] \
              || { echo "::error::'$TAG' es un prerelease y no despliega producción"; exit 1; }
          fi
          echo "Aprobación verificada: $TAG por $ACTOR ($EVENTO)"

      - name: Descargar dist/
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-production
          path: ${{ env.RUTA_COMPONENTE }}/web/dist

      - name: Descargar functions/ (lib compilado + package-lock)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: functions-production
          # Restaura lib/ y package-lock.json donde firebase.json los espera.
          path: ${{ env.RUTA_COMPONENTE }}/functions

      - name: Autenticar en GCP (WIF + impersonación, SA de producción)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_PROD }}

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Conservar copia de la versión actual (canal "previa" para rollback)
        # Clona el contenido en vivo a un canal de vista previa de larga
        # duración. Si el health check posterior falla, post-despliegue lo
        # vuelve a clonar sobre live. Ver 01-seguridad/06-rollback-e-incidentes.md.
        continue-on-error: true
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_PROD }}
          SITIO: ${{ vars.FIREBASE_SITE_ID || vars.GCP_PROJECT_ID_PROD }}
        run: |
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          firebase hosting:channel:create previa --project "$PROYECTO" --expires 30d \
            --non-interactive >/dev/null 2>&1 || true
          firebase hosting:clone "$SITIO:live" "$SITIO:previa" --project "$PROYECTO"

      - name: Cloud Functions — dependencias para que firebase deploy lea el código
        # `firebase deploy` no solo SUBE functions/: antes CARGA lib/index.js
        # para descubrir qué Functions declara, y para eso necesita
        # functions/node_modules con firebase-functions. Sin él falla con
        # «Couldn't find firebase-functions package… An unexpected error has
        # occurred» (v0.1.1, 2026-09-12). Se instala con el package-lock.json del
        # artefacto —el mismo con el que Cloud Build hará `npm ci`, así que no
        # cambia ninguna versión—, solo dependencias de runtime y sin scripts de
        # instalación (riesgo S-9 del estándar). node_modules NO se sube:
        # firebase.json lo excluye. El lib/ tampoco se toca: sigue siendo el
        # compilado y probado en `construir`.
        env:
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules,firestore:indexes,functions,storage' }}
        run: |
          set -euo pipefail
          if [[ "$SOLO" == *functions* ]]; then
            ( cd functions && npm ci --omit=dev --ignore-scripts --no-audit --no-fund )
            test -f functions/node_modules/firebase-functions/package.json
            echo "Dependencias de runtime de functions/ instaladas desde el lockfile del artefacto."
          fi

      - name: Desplegar hosting + reglas (producción)
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_PROD }}
          SOLO: ${{ vars.FIREBASE_DEPLOY_ONLY || 'hosting,firestore:rules,firestore:indexes,functions,storage' }}
          URL_PROD: ${{ vars.PROD_URL }}
          SITIO_PUBLICO: ${{ vars.SITIO_PUBLICO }}
          # Ver el bloque «LA FACTURA MÍNIMA» más abajo. Vacía por defecto: la
          # protección de firebase-tools queda puesta salvo que se la levante a
          # propósito para un despliegue concreto.
          FORZAR_FACTURA: ${{ vars.FIREBASE_DEPLOY_FORCE }}
          BUCKET_STORAGE: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          # Los parámetros de las Functions (`defineString`) se leen de
          # functions/.env, que está en .gitignore: el repositorio es público y
          # ningún valor de infraestructura se versiona. Se escribe acá desde
          # una variable de GitHub.
          # FALLA si falta, a propósito: SITIO_PUBLICO tiene default vacío, y sin
          # él los enlaces del catálogo pasarían en silencio a <proyecto>.web.app
          # en vez del dominio propio. Un despliegue que cambia algo sin avisar
          # es peor que uno que no arranca.
          if [[ "$SOLO" == *functions* ]]; then
            [[ -n "$SITIO_PUBLICO" ]] \
              || { echo "::error::Falta vars.SITIO_PUBLICO (ver .github/DESPLIEGUE-FIREBASE.md, «Estado real»)"; exit 1; }
            # INSTANCIAS_MINIMAS=1 va ESCRITO aunque sea el valor por defecto:
            # con --non-interactive firebase-tools NO toma el default de un
            # parámetro ausente del .env, falla («In non-interactive mode but
            # have no value», lib/deploy/functions/params.js:181 en 15.28.1).
            printf 'SITIO_PUBLICO=%s\nINSTANCIAS_MINIMAS=1\n' "$SITIO_PUBLICO" > functions/.env
          fi
          # EL BUCKET DE STORAGE SE DECLARA, NO SE ADIVINA (2026-09-17).
          # firebase.json apunta las reglas de Storage al destino «principal» y
          # acá se resuelve ese destino al bucket real, desde la misma variable
          # con la que se compila la consola. Con un destino explícito
          # firebase-tools NO llama a GET /v1alpha/projects/{p}/defaultBucket
          # (deploy/storage/prepare.js: solo lo hace cuando `storage` no es una
          # lista), y esa llamada es la que hundió v0.5.3 dos veces: con la
          # identidad federada de la cuenta de despliegue la API responde 404
          # aunque el bucket por defecto exista, el dueño reciba 200 y el
          # verificador de políticas diga que el permiso está concedido.
          # firebase-tools traduce ese 404 a «Firebase Storage has not been set
          # up», que apunta a la causa equivocada. Sin la variable, se corta
          # antes de simular: un despliegue de Storage sin bucket no tiene
          # sentido, y fallar acá es más barato que descubrirlo tras la
          # aprobación del entorno.
          if [[ "$SOLO" == *storage* ]]; then
            [[ -n "${BUCKET_STORAGE:-}" ]] \
              || { echo "::error::Falta vars.VITE_FIREBASE_STORAGE_BUCKET y el despliegue incluye storage"; exit 1; }
            firebase target:apply storage principal "${BUCKET_STORAGE#gs://}" --project "$PROYECTO"
          fi
          # SIMULACIÓN PRIMERO (2026-09-12). `--dry-run` corre predeploy y
          # prepare —permisos, secretos, dependencias, descubrimiento de las
          # Functions— y se salta deploy, release y postdeploy (firebase-tools
          # 15.28.1, src/deploy/index.ts). Ahí fallaron los cuatro primeros
          # intentos de v0.1.x. Si la simulación falla, no se publica NADA.
          # Hosting queda FUERA a propósito: su prepare crea una versión en el
          # sitio aunque sea dry-run (src/deploy/hosting/prepare.ts,
          # api.createVersion) y cada simulación dejaría una versión huérfana.
          # Límite: la simulación no ejerce la publicación (Cloud Build, Cloud
          # Run, Eventarc).
          # EL MISMO `--force` VA EN LA SIMULACIÓN, y por eso se decide ACÁ ARRIBA.
          # `--dry-run` corre el prepare completo, así que choca con la misma
          # protección de la factura mínima y corta antes de publicar: en el
          # segundo intento de v0.5.x el parámetro estaba solo en el comando de
          # publicación y la corrida falló igual, en la simulación. Si la
          # simulación no acepta lo que el despliegue va a aceptar, no está
          # simulando el despliegue.
          FORZAR=""
          if [[ -n "${FORZAR_FACTURA:-}" ]]; then
            FORZAR="--force"
            echo "::warning::vars.FIREBASE_DEPLOY_FORCE activa: se acepta subir el piso de la factura y --force borra Functions que ya no estén en el código."
          fi
          # PRODUCCIÓN QUEDA EN UNA INSTANCIA MÍNIMA (revisión de seguridad de
          # #215, 26/09/2026). Bajar de 1 a 0 no pide --force ni avisa, y
          # firebase-tools carga `functions/.env.<proyecto>` DESPUÉS de `.env` y
          # lo pisa (lib/functions/env.js). Se corta antes de simular si hay otro
          # archivo de parámetros o si la línea no quedó exactamente una vez en 1.
          if [[ "$SOLO" == *functions* ]]; then
            if compgen -G 'functions/.env.*' >/dev/null; then
              echo "::error::Hay un functions/.env.* que pisaría los parámetros de producción."; exit 1
            fi
            # El .env COMPLETO tiene que ser exactamente el esperado: el lector de
            # firebase-tools acepta espacios, `export` y espacios alrededor del
            # `=` (lib/functions/env.js, LINE_RE), así que buscar una línea con
            # grep no alcanza (revisión de seguridad de #219). Y SITIO_PUBLICO no
            # puede traer saltos de línea, comillas ni `#`: sería una línea extra.
            case "$SITIO_PUBLICO" in
              *$'\n'*|*$'\r'*|*'"'*|*"'"*|*'#'*)
                echo "::error::vars.SITIO_PUBLICO trae caracteres que el .env interpretaría."; exit 1 ;;
            esac
            diff <(printf 'SITIO_PUBLICO=%s\nINSTANCIAS_MINIMAS=1\n' "$SITIO_PUBLICO") functions/.env >/dev/null \
              || { echo "::error::functions/.env de producción no es exactamente SITIO_PUBLICO + INSTANCIAS_MINIMAS=1 (sin CPU_FRACCIONARIA)."; exit 1; }
          fi
          SIMULAR=$(printf '%s' "$SOLO" | tr ',' '\n' | grep -v -x -e hosting -e '' | paste -sd, - || true)
          if [[ -n "$SIMULAR" ]]; then
            echo "Simulando: $SIMULAR"
            firebase deploy --only "$SIMULAR" --project "$PROYECTO" --non-interactive $FORZAR --dry-run
          fi
          # LA FACTURA MÍNIMA (2026-09-17). firebase-tools se NIEGA a desplegar
          # Functions que suben el piso de la factura —`minInstances` mayor que
          # cero— y corta con «Pass the --force option to deploy functions that
          # increase the minimum bill». Así falló el primer intento de v0.5.0,
          # que llevaba una instancia siempre despierta en `ingesta` y
          # `configuracionFlujo` para que la primera respuesta del asistente no
          # pague el arranque en frío. Nada se desplegó: la protección corta
          # antes de publicar.
          #
          # POR QUÉ NO SE PONE `--force` FIJO. `--force` no solo acepta el costo:
          # también borra sin preguntar las Functions desplegadas que ya no
          # están en el código. Dejarlo puesto convertiría cada despliegue en
          # uno que puede borrar producción en silencio. Por eso vive en una
          # variable del repositorio, vacía salvo cuando se decide subir el
          # piso, y se apaga después. Antes de encenderla hay que comparar las
          # Functions desplegadas con las que exporta el código: si alguna sobra
          # en la nube, `--force` la borra.
          firebase deploy --only "$SOLO" --project "$PROYECTO" --non-interactive $FORZAR \
            --message "producción ${GITHUB_REF_NAME} (run ${GITHUB_RUN_ID})"
          echo "### Producción desplegada: $URL_PROD (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fase 7 — post-despliegue: health check con reintentos; si falla, rollback
  # y registro del Deployment. El Environment ya crea un Deployment de GitHub;
  # aquí se registra además el resultado de la verificación (útil en Modo B0).
  # ---------------------------------------------------------------------------
  post-despliegue:
    name: post-despliegue
    needs: desplegar-produccion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment SIN reglas de proteccion, a proposito. Existe por la
    # condicion de atributos del proveedor OIDC, que exige que el `sub` del
    # token nombre un Environment (ver .github/DESPLIEGUE-FIREBASE.md §2).
    # Sin esto, este job NO puede autenticarse y el rollback automatico no
    # funciona: se descubriria justo cuando hace falta.
    # No se reutiliza `production` porque su revisor obligatorio dejaria el
    # rollback esperando aprobacion humana, que es lo contrario de un rollback.
    environment:
      name: production-rollback
    permissions:
      contents: read
      id-token: write
      deployments: write
    # SIN `defaults.run.working-directory`, a propósito. Este job no hace
    # checkout, así que admin/ no existe: con el working-directory en admin/
    # el runner no podía ni arrancar bash («An error occurred trying to start
    # process '/usr/bin/bash' with working directory …/admin. No such file or
    # directory»), el health check no corría y el despliegue sano de v0.1.4
    # (2026-09-13) quedó registrado como fallido. Ninguno de sus pasos usa
    # archivos del repositorio: curl y `firebase hosting:clone --project`.
    steps:
      - name: Health check de producción (10 intentos, 15 s)
        id: salud
        env:
          URL: ${{ vars.PROD_URL }}
          RUTA_SALUD: ${{ vars.HEALTH_PATH || '/healthz' }}
        run: |
          set -uo pipefail
          for i in $(seq 1 10); do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -L "${URL%/}${RUTA_SALUD}" || echo 000)
            # Una SPA estática puede no exponer /healthz: 404 en la ruta de salud
            # se acepta si / responde 200.
            if [[ "$codigo" == "404" ]]; then
              codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -L "${URL%/}/" || echo 000)
            fi
            [[ "$codigo" == "200" ]] && { echo "ok=true" >> "$GITHUB_OUTPUT"; echo "OK ($i)"; exit 0; }
            echo "Intento $i: $codigo"; sleep 15
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Producción no responde 200 tras 10 intentos"

      - name: Autenticar en GCP para rollback
        if: steps.salud.outputs.ok == 'false'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_PROD }}

      - name: Rollback de hosting (clonar canal "previa" sobre live)
        if: steps.salud.outputs.ok == 'false'
        env:
          PROYECTO: ${{ vars.GCP_PROJECT_ID_PROD }}
          SITIO: ${{ vars.FIREBASE_SITE_ID || vars.GCP_PROJECT_ID_PROD }}
        run: |
          set -euo pipefail
          npm i -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"
          # Único procedimiento de rollback del estándar (D7): clonar el canal
          # "previa" guardado antes del deploy sobre live. Si el canal no
          # existe, el rollback es MANUAL: consola Firebase → Hosting →
          # Historial de versiones → "Revertir" (ver 06-rollback-e-incidentes.md).
          # Las reglas de Firestore se revierten con `git revert` + nuevo tag.
          if firebase hosting:clone "$SITIO:previa" "$SITIO:live" --project "$PROYECTO"; then
            echo "::warning::ROLLBACK ejecutado: live restaurado desde el canal 'previa'."
          else
            echo "::error::Rollback automático no disponible. Ejecute el rollback manual: consola Firebase → Hosting → Historial → Revertir. Ver 01-seguridad/06-rollback-e-incidentes.md"
          fi

      - name: Registrar resultado del despliegue
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SALUD_OK: ${{ steps.salud.outputs.ok }}
          URL_PROD: ${{ vars.PROD_URL }}
        with:
          script: |
            const ok = process.env.SALUD_OK === 'true';
            const { data: d } = await github.rest.repos.createDeployment({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: context.ref, environment: 'production', auto_merge: false,
              required_contexts: [], transient_environment: false,
              description: `Verificación post-despliegue ${context.ref}`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              deployment_id: d.id, state: ok ? 'success' : 'failure',
              environment_url: process.env.URL_PROD,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: ok ? 'Health check correcto' : 'Health check fallido; rollback intentado'
            });
            core.summary.addHeading('Post-despliegue')
              .addRaw(ok ? 'Producción verificada correctamente.' : 'FALLO de verificación: revise el rollback.')
              .write();
            if (!ok) core.setFailed('Health check de producción fallido');

  # ---------------------------------------------------------------------------
  # compuerta-pr (D1): ÚNICO status check que exigen los rulesets de main.
  # Agrega calidad y seguridad-estatica (con o sin matriz) en un solo contexto
  # estable; falla si cualquiera de sus needs no terminó en success.
  # ---------------------------------------------------------------------------
  compuerta-pr:
    name: compuerta-pr
    needs: [preparar, calidad, calidad-documentacion, seguridad-estatica]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultados de los jobs requeridos
        env:
          HAY_COMPONENTE: ${{ needs.preparar.outputs.hay_componente }}
          HUBO_CAMBIO: ${{ needs.preparar.outputs.admin_cambio }}
          R_PREPARAR: ${{ needs.preparar.result }}
          R_CALIDAD: ${{ needs.calidad.result }}
          R_DOCS: ${{ needs.calidad-documentacion.result }}
          R_SEGURIDAD: ${{ needs.seguridad-estatica.result }}
        run: |
          set -euo pipefail
          echo "preparar=$R_PREPARAR"
          echo "calidad=$R_CALIDAD (componente=$HAY_COMPONENTE, cambio=$HUBO_CAMBIO)"
          echo "calidad-documentacion=$R_DOCS | seguridad-estatica=$R_SEGURIDAD"

          # Obligatorios SIEMPRE, toque o no el componente. Son los que
          # impiden que la compuerta quede vacia cuando 'calidad' se omite.
          for r in "$R_PREPARAR" "$R_DOCS" "$R_SEGURIDAD"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::compuerta-pr bloqueada: algun job requerido no termino en success"
              exit 1
            fi
          done

          # 'calidad' solo puede omitirse por dos motivos legitimos y
          # verificables: que el componente no exista todavia, o que este
          # evento no lo toque. En cualquier otro caso, un 'skipped' es un
          # fallo, no una aprobacion: si no, bastaria con romper 'preparar'
          # para que el panel entre sin revisar.
          if [[ "$R_CALIDAD" == "success" ]]; then
            echo "compuerta-pr: aprobada"; exit 0
          fi

          if [[ "$R_CALIDAD" == "skipped" ]]; then
            if [[ "$HAY_COMPONENTE" != "true" ]]; then
              echo "::notice::'calidad' omitida: admin/package.json todavia no existe."
              echo "compuerta-pr: aprobada"; exit 0
            fi
            if [[ "$HUBO_CAMBIO" == "false" ]]; then
              echo "::notice::'calidad' omitida: este cambio no toca admin/."
              echo "compuerta-pr: aprobada"; exit 0
            fi
            echo "::error::compuerta-pr bloqueada: 'calidad' se omitio sin motivo valido (componente=$HAY_COMPONENTE, cambio=$HUBO_CAMBIO)"
            exit 1
          fi

          echo "::error::compuerta-pr bloqueada: 'calidad' termino en $R_CALIDAD"
          exit 1
